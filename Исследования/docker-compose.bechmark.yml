name: demo

services:
  # 1. In-Memory Redis Cache
  redis-cart:
    image: redis:alpine
    restart: unless-stopped
    deploy:
      replicas: 2

  # 2. Cart Service (.NET 7)
  cartservice:
    image: gcr.io/google-samples/microservices-demo/cartservice:v0.8.0
    environment:
      - REDIS_ADDR=redis-cart:6379
      - PORT=7070
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    depends_on:
      - redis-cart
    restart: unless-stopped
    deploy:
      replicas: 4

  # 3. Product Catalog Service (Golang)
  productcatalogservice:
    image: gcr.io/google-samples/microservices-demo/productcatalogservice:v0.8.0
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    restart: unless-stopped
    deploy:
      replicas: 4

  # 4. Currency Service (Node.js)
  currencyservice:
    image: gcr.io/google-samples/microservices-demo/currencyservice:v0.8.0
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    restart: unless-stopped
    deploy:
      replicas: 4

  # 5. Shipping Service (Golang)
  shippingservice:
    image: gcr.io/google-samples/microservices-demo/shippingservice:v0.8.0
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    restart: unless-stopped
    deploy:
      replicas: 3

  # 6. Payment Service (Node.js)
  paymentservice:
    image: gcr.io/google-samples/microservices-demo/paymentservice:v0.8.0
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    restart: unless-stopped
    deploy:
      replicas: 3

  # 7. Checkout Service (Golang)
  checkoutservice:
    image: gcr.io/google-samples/microservices-demo/checkoutservice:v0.8.0
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - currencyservice
      - cartservice
    restart: unless-stopped
    deploy:
      replicas: 3

  # 8. Email Service (Python)
  emailservice:
    image: gcr.io/google-samples/microservices-demo/emailservice:v0.8.0
    environment:
      - PORT=8080
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    restart: unless-stopped
    deploy:
      replicas: 4

  # 9. Recommendation Service (Python)
  recommendationservice:
    image: gcr.io/google-samples/microservices-demo/recommendationservice:v0.8.0
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    depends_on:
      - productcatalogservice
    restart: unless-stopped
    deploy:
      replicas: 4

  # 10. Ad Service (Java 17 G1GC + AlwaysPreTouch for guaranteed physical RSS allocation)
  adservice:
    image: gcr.io/google-samples/microservices-demo/adservice:v0.8.0
    environment:
      - PORT=9555
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
      - JAVA_TOOL_OPTIONS=-Xms750m -Xmx750m -XX:+AlwaysPreTouch -XX:+UseG1GC
    restart: unless-stopped
    deploy:
      replicas: 10

  # 11. Frontend / Web UI (Golang)
  frontend:
    image: gcr.io/google-samples/microservices-demo/frontend:v0.8.0
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - AD_SERVICE_ADDR=adservice:9555
      - DISABLE_PROFILER=1
      - DISABLE_TRACING=1
    ports:
      - "9090:8080"
    depends_on:
      - cartservice
      - productcatalogservice
      - currencyservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    restart: unless-stopped
    deploy:
      replicas: 1

  # 12. Load Generator (Python Locust)
  loadgenerator:
    image: gcr.io/google-samples/microservices-demo/loadgenerator:v0.8.0
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=50
    depends_on:
      - frontend
    restart: unless-stopped
